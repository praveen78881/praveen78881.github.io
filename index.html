<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaryaSetu</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; background: #FAF7F2; color: #1A2E5A;
           display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; }

    a.btn { display: inline-block; margin-top: 1rem; padding: .7rem 1.4rem; border-radius: 10px;
            background: #1A2E5A; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #12151f; color: #e8ecf5; } }
  </style>
</head>
<body>
  <main>
    <h1>KaryaSetu</h1>
    <p>Team task manager &amp; messaging.</p>
    <a class="btn" href="/karyasetu-app/">Open the app</a>
  </main>

</html>
